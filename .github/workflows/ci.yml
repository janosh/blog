name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # use the project's pinned pnpm (packageManager field) via corepack
      - &install_dependencies
        run: corepack enable && pnpm install
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: true
          # matterviz depends on svelte-widgets via GitHub
          PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: false

      - name: Lint and format check
        run: pnpm exec vp check

      - name: Svelte type check
        run: pnpm exec svelte-kit sync && pnpm exec svelte-check --threshold error

      - name: Unit tests
        run: pnpm exec vp test run

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Discover broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # excluded URLs are valid but unreachable from CI runners (TLS/datacenter firewall) or private (404 for anonymous)
          # tests/ is skipped since its URLs are placeholder fixtures (e.g. arxiv.org/abs/example), not published links
          # roughly 200 live third-party links get hit per run, so one slow host used to fail the
          # whole merge. lychee defaults to 128 requests in flight, 20s timeout and 3 retries 1s
          # apart, which is enough load to time out small academic servers we do not control.
          args: --exclude '%7B' --exclude '^file://' --exclude-path '(^|/)tests/' --exclude 'aspell\.net|physik\.ruhr-uni-bochum\.de|h-its\.org|physik\.uni-hamburg\.de|theorie\.physnet\.uni-hamburg\.de|qu\.uni-hamburg\.de|ita\.uni-heidelberg\.de|github\.com/janosh/thesis|camphysoc\.co\.uk|doi\.org/10\.17863|repository\.cam\.ac\.uk' --root-dir . --accept 100..=103,200..=299,403,429,502,503,999 --max-concurrency 16 --timeout 30 --max-retries 5 --retry-wait-time 2 -- ./**/*.{md,svelte,ts,yml,yaml}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - *install_dependencies

      # Roboto (from app.css' font stack) and color emoji flags for the CV PDF that
      # src/routes/cv/build-pdf.ts prints with headless Chrome
      - run: sudo apt-get update && sudo apt-get install -y fonts-roboto fonts-noto-color-emoji

      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
