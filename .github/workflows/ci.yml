name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # use the project's pinned pnpm (packageManager field) via corepack
      - &install_dependencies
        run: corepack enable && pnpm install
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: true
          # Git dependencies use npm to prepare; svelte-widgets' dev-only Vitest/Vite+ peers conflict.
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Lint and format check
        run: pnpm exec vp check

      - name: Svelte type check
        run: pnpm exec svelte-kit sync && pnpm exec svelte-check --threshold error

      - name: Unit tests
        run: pnpm exec vp test run

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Discover broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # excluded URLs are valid but unreachable from CI runners (TLS/datacenter firewall) or private (404 for anonymous)
          # roughly 200 live third-party links get hit per run, so one slow host used to fail the
          # whole merge. lychee defaults to 128 requests in flight, 20s timeout and 3 retries 1s
          # apart, which is enough load to time out small academic servers we do not control.
          args: --exclude '%7B' --exclude '^file://' --exclude 'aspell\.net|physik\.uni-hamburg\.de|theorie\.physnet\.uni-hamburg\.de|qu\.uni-hamburg\.de|ita\.uni-heidelberg\.de|github\.com/janosh/thesis|camphysoc\.co\.uk|doi\.org/10\.17863|repository\.cam\.ac\.uk' --root-dir . --accept 100..=103,200..=299,403,429,502,503,999 --max-concurrency 16 --timeout 30 --max-retries 5 --retry-wait-time 2 -- ./**/*.{md,svelte,ts,yml,yaml}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - *install_dependencies

      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
